# Builds the release's Docker images when a release is tagged, and pushes them to the GitHub Container
# Registry as ghcr.io/freedomridge/<image>:X.Y.Z (the compose files name them), so a server upgrades by
# pulling instead of building. Only freedomridge/freedomridge builds them: the images hold only what this
# repository publishes, and the development repository and forks skip both jobs. It logs in with the
# workflow's own token; nothing is stored.
#
# `try-it` then starts docker-compose.try.yml from the published images without logging in, so a release
# whose images can't be pulled anonymously, or don't start, fails here.
#
# Started by hand with a release tag, it builds and pushes that release again. With push off it is a
# rehearsal of any branch or tag: nothing is pushed, and try-it runs on images built on its own runner.
#
# Each image is built for linux/amd64 and linux/arm64, each natively on a runner of that architecture (no
# emulation), and pushed by digest. `manifest` then puts both under the release's tag, so Docker pulls the
# one matching the machine. try-it runs on both architectures.
#
# Like publish.yml, every action is pinned to a commit (Dependabot updates the pins) and no build cache
# is restored: what these images contain must not depend on another run.
name: Release images

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Release tag (vX.Y.Z); with push off, any branch or tag'
        required: true
      push:
        description: 'Push the images (off: a rehearsal, nothing pushed)'
        type: boolean
        default: true

permissions: {}

env:
  REF: ${{ inputs.ref || github.ref_name }}
  PUSH: ${{ github.event_name == 'push' || inputs.push }}

jobs:
  image:
    if: github.repository == 'freedomridge/freedomridge'
    name: ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Each is built from Dockerfile.<image>. The worker image also runs the job runner.
        image: [backend, worker, db, backup, frontend]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: The images carry VERSION; pushed ones only from the release's tag
        id: release
        run: |
          version=$(cat VERSION)
          if [ "$PUSH" = true ]; then
            [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "$REF is not a release tag vX.Y.Z" >&2; exit 1; }
            [ "$REF" = "v$version" ] || { echo "$REF does not match VERSION $version" >&2; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        id: build
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          # By digest, untagged: `manifest` tags both architectures together.
          outputs: type=image,name=ghcr.io/freedomridge/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH == 'true' }}
          labels: |
            org.opencontainers.image.source=https://github.com/freedomridge/freedomridge
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}
            org.opencontainers.image.licenses=MIT
      - name: Its digest, for manifest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: image
    if: github.repository == 'freedomridge/freedomridge' && (github.event_name == 'push' || inputs.push)
    name: ${{ matrix.image }} (both architectures)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [backend, worker, db, backup, frontend]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: digest-${{ matrix.image }}-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The release's tag, on both architectures' images
        env:
          IMAGE: ghcr.io/freedomridge/${{ matrix.image }}
        run: |
          # image checked that REF is vVERSION.
          version=${REF#v}
          [ "$(ls digests | wc -l)" = 2 ] || { echo "expected 2 digests, found: $(ls digests)" >&2; exit 1; }
          sources=$(for digest in digests/*; do echo "$IMAGE@sha256:${digest#digests/}"; done)
          # shellcheck disable=SC2086  # one argument per source image
          docker buildx imagetools create -t "$IMAGE:$version" \
            --annotation "index:org.opencontainers.image.source=https://github.com/freedomridge/freedomridge" \
            --annotation "index:org.opencontainers.image.version=$version" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            $sources
          docker buildx imagetools inspect "$IMAGE:$version"

  try-it:
    needs: [image, manifest]
    # manifest is skipped in a rehearsal.
    if: github.repository == 'freedomridge/freedomridge' && !failure() && !cancelled()
    name: try-it (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: The published images, pulled without a login
        if: env.PUSH == 'true'
        run: |
          docker logout ghcr.io
          docker compose -f docker-compose.try.yml pull
      - name: A rehearsal builds them here, under the names the compose file uses
        if: env.PUSH != 'true'
        run: |
          for image in db backend worker frontend; do
            docker build -q -t "ghcr.io/freedomridge/$image:$(cat VERSION)" -f "Dockerfile.$image" .
          done
      - name: Docker took the images for this machine's architecture
        run: |
          arch=$(dpkg --print-architecture)
          for image in db backend worker frontend; do
            got=$(docker image inspect --format '{{.Architecture}}' "ghcr.io/freedomridge/$image:$(cat VERSION)")
            echo "$image: $got"
            [ "$got" = "$arch" ] || { echo "$image is $got on an $arch machine" >&2; exit 1; }
          done
      - run: docker compose -f docker-compose.try.yml up -d
      - name: The app answers, and admin / admin123 logs in
        run: |
          timeout 300 bash -c 'until curl -fsS http://127.0.0.1:8000/api/health | grep -q "\"status\":\"ok\""; do sleep 5; done'
          curl -fsS http://127.0.0.1:8000/api/health
          echo
          timeout 120 bash -c 'until curl -fsS -o /dev/null http://127.0.0.1:3000/; do sleep 5; done'
          curl -fsS http://127.0.0.1:3000/runtime-config
          echo
          curl -fsS -o /dev/null -X POST http://127.0.0.1:3000/api/auth/login \
            -H 'Content-Type: application/json' -d '{"username": "admin", "password": "admin123"}'
          echo "logged in through the frontend"
      - if: failure()
        run: docker compose -f docker-compose.try.yml logs --tail=200
