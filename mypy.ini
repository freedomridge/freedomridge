# Project mypy settings (pydantic plugin,
# check_untyped_defs, strict-ish flags). Enforced by the BLOCKING `quality` CI
# job — keep `mypy backend/ python/ examples/` clean.
[mypy]
plugins = pydantic.mypy
namespace_packages = True
explicit_package_bases = True
exclude = venv|\.git|__pycache__|\.mypy_cache|node_modules|frontend
ignore_missing_imports = True
disable_error_code = import-untyped, no-untyped-call

check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
# OFF deliberately: which third-party stubs are installed differs between the
# lean typecheck envs (server dependencies only) and richer dev venvs
# (boto3-stubs, etc.). With it ON, a `# type: ignore` that's needed WITH a stub
# is flagged "unused" WITHOUT it (and vice-versa), so the gate can't be green in
# both. Keeping it off lets ignores suppress the real errors where they occur
# without making CI env-fragile.
warn_unused_ignores = False
no_implicit_reexport = True
strict_equality = True
