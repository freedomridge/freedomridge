# Freedom Ridge PostgreSQL Configuration
#
# This is the DEFAULT config, tuned for a machine with 32GB RAM.
# For different machine sizes, copy and adjust the Memory section:
#
#   16GB RAM: shared_buffers=4GB,  work_mem=64MB,  effective_cache_size=12GB
#   32GB RAM: shared_buffers=8GB,  work_mem=128MB, effective_cache_size=24GB
#   64GB RAM: shared_buffers=16GB, work_mem=256MB, effective_cache_size=48GB
#
# Rule of thumb:
#   shared_buffers = 25% of RAM
#   effective_cache_size = 75% of RAM
#   work_mem = RAM / 256 (accounts for concurrent queries)
#   maintenance_work_mem = RAM / 32

# --- Connection ---
listen_addresses = '*'
max_connections = 100

# --- Memory (32GB default) ---
shared_buffers = 8GB
work_mem = 128MB
effective_cache_size = 24GB
maintenance_work_mem = 1GB

# --- Planner ---
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Parallelism ---
max_parallel_workers_per_gather = 4
# Also the number of sidebar facet scans the whole backend runs at once (all workers together share
# that many database-wide slots, backend/routers/datasets.py). 0 turns parallel query off but not the
# sidebar: it then runs max_worker_processes scans at once (the pool parallel workers come from).
max_parallel_workers = 8
max_worker_processes = 8

# --- WAL ---
wal_buffers = 64MB
min_wal_size = 1GB
# A map re-fit's swap rewrites every coordinate of a map at once. Frequent checkpoints
# cause repeated full-page images during that write; a larger WAL budget and compression
# reduce that overhead. Allow disk and recovery-time headroom for WAL growth between
# checkpoints. Both settings take effect on a reload.
max_wal_size = 16GB
wal_compression = lz4

# --- Logging ---
log_min_duration_statement = 5000
log_temp_files = 1GB   # log any statement that spills a temp file > 1GB (spill visibility)

# --- Temp files ---
# Cap per-session temp/spill (sorts, hashes, DISTINCT) so a single heavy query can
# never fill the disk and take Postgres down (ENOSPC). The
# app cache lives off-disk now; this is the backstop for query spill. Was unlimited
# (-1). Tune to the free space on the DB's disk.
temp_file_limit = 20GB
