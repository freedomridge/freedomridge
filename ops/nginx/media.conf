limit_req zone=media_limit burst=3000 delay=400;
limit_conn media_conn 512;
proxy_pass http://$backend_upstream;
# Revalidate authorization at the backend on every request. Its persistent crop
# and composite caches still avoid repeated rendering. Do not cache ACL decisions.
proxy_read_timeout 60s;
add_header X-Cache-Status "BYPASS" always;
include /etc/nginx/fridge/security-headers.conf;
