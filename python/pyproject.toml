[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "freedomridge"
version = "2.1.1"
license = "MIT"
description = "Python SDK for Freedom Ridge Dataset Explorer"
dependencies = [
    "requests",
    "numpy",
    "Pillow",
    "tqdm",
]

[project.optional-dependencies]
# CLIP embeddings + UMAP visualization (compute_embeddings / compute_visualization).
# psutil: RAM-aware auto fit-size (optional; falls back to /proc/meminfo).
embeddings = ["sentence-transformers", "umap-learn", "psutil"]
# Transformers image models for compute_embeddings(model_source="huggingface"), e.g. DINOv3.
# torchvision: their fast image processors need it (DINOv3 has no other kind).
huggingface-embeddings = ["torch", "torchvision", "transformers>=5.21"]
# Patch embeddings (compute_patch_embeddings)
patch-embeddings = ["torch", "transformers>=5.21"]
# Image quality metrics (compute_metrics)
metrics = ["opencv-python-headless"]
# Perceptual hashing (compute_hashes)
hashes = ["imagehash"]
# Quality scoring + embedding dedup (compute_uniqueness/representativeness/find_unique/find_duplicates)
quality = ["scikit-learn"]
# Everything
all = [
    "sentence-transformers",
    "umap-learn",
    "psutil",
    "torch",
    "torchvision",
    "transformers>=5.21",
    "opencv-python-headless",
    "imagehash",
    "scikit-learn",
]

[tool.setuptools.packages.find]
include = ["fridge*"]
