user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    include /etc/nginx/fridge/real-ip.conf;
    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent rt=$request_time';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 60s;
    client_max_body_size 1m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    geo $fridge_ip_allowlisted {
        default 0;
        include /etc/nginx/allowlist.conf;
    }
    map $fridge_ip_allowlisted $fridge_client_key {
        default $binary_remote_addr;
        1 "$binary_remote_addr$cookie_session_id";
    }

    # Shared across workers; trusted networks get a budget per signed-in browser.
    limit_req_zone $fridge_client_key zone=login_limit:10m rate=6r/m;
    limit_req_zone $fridge_client_key zone=demo_login_limit:10m rate=30r/m;
    limit_req_zone $fridge_client_key zone=heavy_limit:10m rate=2r/s;
    limit_req_zone $fridge_client_key zone=api_limit:10m rate=50r/s;
    limit_req_zone $fridge_client_key zone=upload_limit:10m rate=10r/s;
    limit_req_zone $fridge_client_key zone=media_limit:10m rate=200r/s;
    limit_conn_zone $fridge_client_key zone=per_ip:10m;
    limit_conn_zone $fridge_client_key zone=media_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn per_ip 100;

    # Docker service IPs can change on recreation. Resolve at request time.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    include /etc/nginx/fridge/proxy.conf;

    server { listen 80 default_server; server_name _; return 444; }
    server {
        listen 80;
        server_name ${DOMAIN_NAME};
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }
        location / { return 301 https://${DOMAIN_NAME}$request_uri; }
    }
    # Reject unknown SNI without presenting the real site certificate.
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
        return 444;
    }
    server {
        listen 443 ssl;
        http2 on;
        server_name ${DOMAIN_NAME};
        ssl_certificate /etc/letsencrypt/live/${DOMAIN_NAME}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_NAME}/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        include /etc/nginx/fridge/security-headers.conf;
        set $backend_upstream backend:8000;
        set $frontend_upstream frontend:3000;
        # Frontend ApiError and login both read JSON detail. Keep backend errors intact.
        error_page 429 = @too_many;
        error_page 503 = @busy;
        error_page 413 = @too_large;
        error_page 502 = @bad_gateway;
        error_page 504 = @gateway_timeout;
        location @too_many {
            default_type application/json;
            add_header Retry-After 10 always;
            include /etc/nginx/fridge/security-headers.conf;
            return 429 '{"detail": "Too many requests, try again shortly"}';
        }
        location @busy {
            default_type application/json;
            add_header Retry-After 10 always;
            include /etc/nginx/fridge/security-headers.conf;
            return 503 '{"detail": "Too many requests, try again shortly"}';
        }
        location @too_large {
            default_type application/json;
            return 413 '{"detail": "Request body too large"}';
        }
        location @bad_gateway {
            default_type application/json;
            return 502 '{"detail": "Service restarting, try again shortly"}';
        }
        location @gateway_timeout {
            default_type application/json;
            return 504 '{"detail": "Request timed out, try again shortly"}';
        }

        location ~ ^/api/auth/demo-login/?$ {
            limit_req zone=demo_login_limit burst=40 nodelay;
            proxy_pass http://$backend_upstream;
            proxy_read_timeout 30s;
        }
        location ~ ^/api/auth/login/?$ {
            limit_req zone=login_limit burst=5 nodelay;
            limit_conn per_ip 10;
            proxy_pass http://$backend_upstream;
            proxy_read_timeout 30s;
        }
        location ~ ^/api/search/by-image/?$ {
            limit_req zone=heavy_limit burst=4 nodelay;
            limit_conn per_ip 4;
            client_max_body_size 30m;
            proxy_pass http://$backend_upstream;
            proxy_read_timeout 120s;
        }
        location ~ ^/api/datasets/[0-9]+/(sparse-sample|export|exports|hashes/export)/?$ {
            limit_req zone=heavy_limit burst=10 nodelay;
            limit_conn per_ip 8;
            proxy_pass http://$backend_upstream;
            proxy_read_timeout 600s;
        }
        location ~ ^/api/samples/[0-9]+/media/?$ { include /etc/nginx/fridge/media.conf; }

        # Preserve the established server/SDK budgets for admin analytical work.
        location ~ ^/api/datasets/[0-9]+/(refresh-stats|quality/ann-index|embeddings/reduce|embeddings/recompute-viz-rank)(/|$) {
            limit_req zone=heavy_limit burst=10 nodelay;
            limit_conn per_ip 8;
            proxy_pass http://$backend_upstream;
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
        }
        # Concept scoring and text/patch search are interactive, not bulk analytics.
        location ~ ^/api/datasets/[0-9]+/concepts(/|$) {
            limit_req zone=api_limit burst=150 nodelay;
            proxy_pass http://$backend_upstream;
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
        }
        # Large bodies on ingest routes (samples, lookup/patch batches, vectors, hashes, coordinates).
        location ~ ^/api/datasets/[0-9]+/samples$ {
            limit_req zone=upload_limit burst=20 nodelay;
            client_max_body_size 100m;
            proxy_pass http://$backend_upstream;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
        location ~ ^/api/datasets/[0-9]+/(embeddings(/patches|/coordinates)?|hashes/upload)/?$ {
            limit_req zone=upload_limit burst=20 nodelay;
            client_max_body_size 100m;
            proxy_pass http://$backend_upstream;
            proxy_read_timeout 600s;
        }
        location ~ ^/api/datasets/[0-9]+/samples/(lookup|bulk-set)/?$ {
            limit_req zone=upload_limit burst=20 nodelay;
            client_max_body_size 100m;
            proxy_pass http://$backend_upstream;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
        # Views can carry large ID filters; keep UI/guest queries on the interactive budget.
        location ~ ^/api/datasets/[0-9]+/samples/query/?$ {
            limit_req zone=api_limit burst=150 nodelay;
            client_max_body_size 10m;
            proxy_pass http://$backend_upstream;
            proxy_read_timeout 600s;
        }
        location /api/ {
            limit_req zone=api_limit burst=150 nodelay;
            proxy_pass http://$backend_upstream;
            proxy_read_timeout 600s;
        }
        location / {
            limit_req zone=api_limit burst=150 nodelay;
            proxy_pass http://$frontend_upstream;
            proxy_read_timeout 60s;
        }
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }
    }
}
